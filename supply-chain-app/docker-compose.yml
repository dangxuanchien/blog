version: '3'
services:
  sourcing-support-dbmart:
    container_name: sourcing_support_dbmart
    image: postgres:12-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dbmart
    volumes:
      - sourcing-support-data:/var/lib/postgresql/data
      - ./server/src/databases/postgresql/resources/backup.sql:/docker-entrypoint-initdb.d/dump_dev.sql
    ports:
      - 5436:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5      
    restart: always 
    networks:
      scpf-network:
        ipv4_address: 172.30.0.2 

  scpf-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: scpf-server
    depends_on:
      sourcing-support-dbmart:
        condition: service_healthy  
    ports:
      - 5001:5001
    env_file:
      - ./server/.env.production
    volumes:
      - ./server/logs:/logs
    networks:
      scpf-network:
        ipv4_address: 172.30.0.3 
  #   networks:
      
  scpf-client:
      build:
          context: ./scpf-ui/src
          dockerfile: Dockerfile
      container_name: scpf-client
      depends_on:
        - scpf-server
      env_file:
        - ./scpf-ui/src/.env.production
      ports:
          - 3001:3001
      volumes:
          - ./scpf-ui/src/resources:/scpf/ui/resources
      networks:
        scpf-network:
          ipv4_address: 172.30.0.4 

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    ports: 
      - 80:80
      - 443:443
    networks:
        scpf-network:
          ipv4_address: 172.30.0.5

networks:
  scpf-network:
    driver: bridge
    ipam:
     config:
       - subnet: 172.30.0.0/24
         gateway: 172.30.0.1

volumes:
  sourcing-support-data:
    driver: local